<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <meta name="description" content="Free online image converter for PNG, JPG, PDF, PSD, WebP and supported RAW files. Convert images privately in your browser with no upload or sign-up." />

    <meta name="theme-color" content="#132432" />
    <title>Free Online Image Converter – RAW, PNG, JPG, PDF &amp; PSD</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebApplication",
            "name": "Convert Any Image",
            "url": "https://convertanyimage.com/",
            "applicationCategory": "MultimediaApplication",

          },
          {
            "@type": "FAQPage",
            "mainEntity": [
              { "@type": "Question", "name": "Can I convert images without uploading them?", "acceptedAnswer": { "@type": "Answer", "text": "Standard conversions process in your browser, so the file remains on your device during conversion." } },
              { "@type": "Question", "name": "Is this image converter free?", "acceptedAnswer": { "@type": "Answer", "text": "The public converter has no sign-up, watermark or payment step for the available browser conversion tools." } },
              { "@type": "Question", "name": "Can I batch convert images?", "acceptedAnswer": { "@type": "Answer", "text": "Yes. Add multiple files, choose an output format, convert the queue, and download the completed files together." } },
              { "@type": "Question", "name": "Can I convert RAW files to JPG?", "acceptedAnswer": { "@type": "Answer", "text": "Supported RAW files can be added to the queue. RAW decoding availability depends on the browser and the camera file type." } }
            ]
          }
        ]
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script
      defer

  </body>

</html>
