name = "convert-any-image-transcript"
main = "src/index.ts"
compatibility_date = "2026-08-26"
workers_dev = true

[vars]
# Cloudflare Pages hostname plus the intended custom domain during DNS cutover.
ALLOWED_ORIGINS = "https://convert-any-image.pages.dev,https://convertanyimage.com,https://www.convertanyimage.com"
CACHE_TTL_SECONDS = "86400"

[ai]
binding = "AI"
