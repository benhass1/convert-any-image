name: Deploy frontend to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "shared/**"
      - ".github/workflows/deploy-frontend.yml"

permissions:
  contents: read

concurrency:
  group: deploy-frontend-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate frontend
        run: pnpm --dir frontend check
      - name: Build frontend
        working-directory: frontend
        run: pnpm build
        env:
          VITE_WORKER_URL: https://convert-any-image-transcript.benmhamed-hassan.workers.dev
          VITE_LOCAL_BACKEND_URL: http://localhost:8000
      - name: Deploy to Cloudflare Pages
        run: pnpm --dir worker exec wrangler pages deploy ../frontend/dist --project-name=convert-any-image --branch=main --commit-message="${{ github.event.head_commit.message }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
